<main class="home">
  <!--
    L'illustration reste un décor indépendant du menu afin que le logo,
    l'accroche et les actions restent accessibles et responsives.
  -->
  <img
    class="home__background"
    src="/assets/board/karak-cover.png"
    alt=""
    aria-hidden="true"
    draggable="false"
  />
  <div class="home__veil" aria-hidden="true"></div>

  <section class="home__hero" aria-labelledby="home-title">
    <div class="home__content">
      <h1 class="home__title" id="home-title">
        <img
          class="home__logo"
          ngSrc="/assets/logo-800.png"
          srcset="/assets/logo-800.png 800w, /assets/logo.png 1676w"
          sizes="(max-width: 700px) 90vw, 42vw"
          width="1676"
          height="938"
          priority
          alt="Karak"
          draggable="false"
        />
      </h1>

      <p class="home__tagline">
        Six héros. Un donjon. D'innombrables trésors.
      </p>

      <nav class="home__navigation" aria-label="Menu principal">
        <a
          class="home__play"
          routerLink="/play"
          aria-label="Jouer"
          title="Jouer"
        >
          <svg class="home__play-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6.5 8.5h11a4 4 0 0 1 3.86 3l1.1 4.6a2.4 2.4 0 0 1-4.45 1.7l-1.6-2.8H7.6L6 17.8a2.4 2.4 0 0 1-4.45-1.7l1.1-4.6a4 4 0 0 1 3.86-3z" />
            <path d="M8 11v4M6 13h4M16 12h.01M19 14h.01" />
          </svg>
          <span>Jouer</span>
        </a>

        <a
          class="home__lore"
          routerLink="/codex"
          [queryParams]="{ from: 'home' }"
          aria-label="Découvrir l'univers du jeu"
          title="Découvrir l'univers du jeu"
        >
          <svg class="home__lore-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5z" />
            <path d="M5 4.5v17M8 5.5h8M8 9h8M8 12.5h5" />
          </svg>
          <span>Découvrir l'univers du jeu</span>
        </a>
      </nav>
    </div>
  </section>
</main>
