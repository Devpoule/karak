<main class="home">

  <section class="home__hero">

    <!-- =====================================================
         PRÉSENTATION
         ===================================================== -->

    <div class="home__content">
      <img
        class="home__logo"
        src="/assets/logo.png"
        alt="Karak"
        draggable="false"
      />

      <h2>Explorez les catacombes</h2>

      <p>
        Incarnez votre héros, parcourez le donjon,
        affrontez ses créatures et rassemblez ses trésors.
      </p>

      <div class="home__actions">
        <a
          class="home__play"
          routerLink="/game"
        >
          Entrer
        </a>

        <a
          class="home__rules"
          routerLink="/rules"
        >
          Règles du jeu
        </a>
      </div>
    </div>


    <!-- =====================================================
         ILLUSTRATION
         ===================================================== -->

    <div class="home__illustration">
      <img
        src="/assets/home-page.png"
        alt="Les héros de Karak"
        draggable="false"
      />
    </div>

  </section>

</main>
