<main class="home">

  <section class="home__hero">

    <!-- =====================================================
         PRÉSENTATION
         ===================================================== -->

    <div class="home__content">
      <img
        class="home__logo"
        src="/assets/logo.png"
        alt="Karak"
        draggable="false"
      />

      <h1>Explorez les catacombes</h1>

      <h2>
        Six héros. Un donjon. D'innombrables trésors.
      </h2>

      <nav class="home__navigation" aria-label="Menu principal">
        <div class="home__actions">
          <a
            class="home__play"
            routerLink="/play"
            title="Nouvelle partie"
          >
            Jouer
          </a>
        </div>

        <a
          class="home__lore"
          routerLink="/codex"
          [queryParams]="{ from: 'home' }"
        >
          <span>Découvrir l'univers du jeu</span>
        </a>
      </nav>
    </div>


  </section>

</main>
