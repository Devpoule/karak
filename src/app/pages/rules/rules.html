<app-game-header context="rules" />


<!-- =========================================================
     LECTEUR DES RÈGLES
     =========================================================

     Le manuel est parcouru page par page.

     Les boutons précédent / suivant sont désactivés lorsque
     l'utilisateur atteint respectivement la première ou
     la dernière page.
     ========================================================= -->

<main class="rules">

  <section class="rules__viewer">

    <!-- Page précédente -->
    <button
      type="button"
      class="rules__navigation"
      [disabled]="currentPage === 1"
      (click)="previousPage()"
      aria-label="Page précédente"
    >
      ‹
    </button>


    <!-- Page actuellement affichée -->
    <div class="rules__document">
      <img
        class="rules__page"
        [src]="currentPageImage"
        [alt]="'Règles de Karak — page ' + currentPage"
        draggable="false"
      />

      <span class="rules__counter">
        {{ currentPage }} / {{ totalPages }}
      </span>
    </div>


    <!-- Page suivante -->
    <button
      type="button"
      class="rules__navigation"
      [disabled]="currentPage === totalPages"
      (click)="nextPage()"
      aria-label="Page suivante"
    >
      ›
    </button>

  </section>

</main>
