<div class="tutorial-panel" [class.tutorial-panel--compact]="compact">
  <button
    type="button"
    class="karak-header-action tutorial-panel__trigger"
    [class.tutorial-panel__trigger--compact]="compact"
    aria-label="Tutoriel"
    title="Tutoriel"
    aria-haspopup="dialog"
    [attr.aria-expanded]="isOpen"
    (click)="open()"
  >
    <svg class="tutorial-panel__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5z" />
      <path d="M5 4.5v17M8 5.5h8M8 9h8M8 12.5h5" />
    </svg>
    <span class="karak-header-action__label tutorial-panel__label">Tutoriel</span>
  </button>

  @if (isOpen) {
    <div class="tutorial-panel__backdrop" role="presentation" (click)="close()">
      <section
        #dialogElement
        class="tutorial-panel__dialog"
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="tutorial-panel-title"
        aria-describedby="tutorial-panel-summary"
        (click)="$event.stopPropagation()"
      >
        <header class="tutorial-panel__header">
          <div>
            <p class="tutorial-panel__eyebrow">{{ currentStep.eyebrow }}</p>
            <h2 id="tutorial-panel-title">{{ currentStep.title }}</h2>
          </div>
          <button type="button" class="tutorial-panel__close" aria-label="Fermer le tutoriel" (click)="close()">×</button>
        </header>

        <div class="tutorial-panel__progress" aria-label="Progression du tutoriel">
          @for (step of steps; track $index) {
            <span [class.tutorial-panel__progress-dot--active]="$index === currentIndex"></span>
          }
        </div>

        <div class="tutorial-panel__body" aria-live="polite">
          <p id="tutorial-panel-summary" class="tutorial-panel__summary">{{ currentStep.summary }}</p>
          <ul>
            @for (tip of currentStep.tips; track tip) {
              <li>{{ tip }}</li>
            }
          </ul>
        </div>

        <footer class="tutorial-panel__actions">
          <button type="button" class="tutorial-panel__skip" (click)="close()">Fermer</button>
          <div class="tutorial-panel__navigation">
            <button type="button" class="tutorial-panel__previous" [disabled]="currentIndex === 0" (click)="previous()">
              Précédent
            </button>
            <button type="button" class="tutorial-panel__next" (click)="next()">
              {{ isLastStep ? 'Terminer le tutoriel' : 'Suivant' }}
            </button>
          </div>
        </footer>
      </section>
    </div>
  }
</div>
