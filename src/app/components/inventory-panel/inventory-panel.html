<section class="inventory-panel" [class.inventory-panel--acquired]="highlightedGroups.length > 0">
  <!--
    Support visuel de l'inventaire.

    inventory-panel.png matérialise déjà graphiquement les emplacements
    réservés aux armes, aux sorts et à la clé.

    Un emplacement vide ne doit donc produire aucun élément
    graphique supplémentaire.

    Seuls les objets réellement possédés par le joueur seront
    affichés par-dessus ce support.
  -->
  <img
    class="inventory-panel__board"
    src="/assets/board/inventory-panel.png"
    alt="Armes, sorts et clé"
    draggable="false"
  />

  <div
    class="inventory-panel__items"
    aria-label="Inventaire du joueur"
  >
    <!-- =====================================================
         ARMES
         ===================================================== -->

    <div class="inventory-panel__group inventory-panel__group--weapons">
      @for (weapon of weaponSlots; track $index) {
        @if (weapon) {
          <div class="inventory-panel__item">
            <!--
              L'illustration de l'arme sera ajoutée lorsque
              les objets du jeu disposeront de leurs assets.
            -->
          </div>
        }
      }
    </div>

    <!-- =====================================================
         SORTS
         ===================================================== -->

    <div class="inventory-panel__group inventory-panel__group--spells">
      @for (spell of spellSlots; track $index) {
        @if (spell) {
          <div class="inventory-panel__item">
            <!--
              L'illustration du sort sera ajoutée lorsque
              les objets du jeu disposeront de leurs assets.
            -->
          </div>
        }
      }
    </div>

    <!-- =====================================================
         CLÉ
         ===================================================== -->

    <div class="inventory-panel__group inventory-panel__group--key">
      @if (hasKey) {
        <div class="inventory-panel__item">
          <!--
            L'illustration de la clé sera ajoutée avec
            l'implémentation des objets du donjon.
          -->
        </div>
      }
    </div>
  </div>
</section>
