<section class="inventory-panel" [class.inventory-panel--acquired]="highlightedGroups.length > 0">
  <!-- Le support contient déjà les emplacements : aucune case vide supplémentaire. -->
  <img
    class="inventory-panel__board"
    src="/assets/board/inventory-panel.png"
    alt=""
    draggable="false"
  />

  <div class="inventory-panel__items" aria-label="Inventaire du joueur">
    <div
      class="inventory-panel__group inventory-panel__group--weapons"
      [class.inventory-panel__group--highlighted]="isHighlighted('weapons')"
    >
      @for (weapon of weaponSlots; track $index) {
        <div class="inventory-panel__slot">
          @if (weapon) {
            <img class="inventory-panel__item" [src]="weapon.image" [alt]="weapon.name" draggable="false" />
          }
        </div>
      }
    </div>

    <div
      class="inventory-panel__group inventory-panel__group--spells"
      [class.inventory-panel__group--highlighted]="isHighlighted('spells')"
    >
      @for (spell of spellSlots; track $index) {
        <div class="inventory-panel__slot">
          @if (spell) {
            <img class="inventory-panel__item" [src]="spell.image" [alt]="spell.name" draggable="false" />
          }
        </div>
      }
    </div>

    <div
      class="inventory-panel__group inventory-panel__group--key"
      [class.inventory-panel__group--highlighted]="isHighlighted('key')"
    >
      <div class="inventory-panel__slot">
        @if (keyItem; as key) {
          <img class="inventory-panel__item" [src]="key.image" [alt]="key.name" draggable="false" />
        }
      </div>
    </div>
  </div>
</section>
