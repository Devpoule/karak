<div class="codex-dialog__backdrop" [class.codex-dialog__backdrop--left]="placement === 'left'" [class.codex-dialog__backdrop--right]="placement === 'right'" (click)="close()">
  <section
    class="codex-dialog"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title"
    (click)="$event.stopPropagation()"
  >
    <header class="codex-dialog__header">
      @if (icon) { <img [src]="icon" [alt]="iconAlt" draggable="false" /> }
      <div>
        @if (subtitle) { <p class="codex-dialog__eyebrow">{{ subtitle }}</p> }
        <h2>{{ title }}</h2>
      </div>
    </header>
    <div class="codex-dialog__body">
      <p>{{ body }}</p>
      @if (powers.length) {
        <div class="codex-dialog__powers" aria-label="Pouvoirs du héros">
          @for (power of powers; track power.id; let index = $index) {
            <article class="codex-dialog__power">
              <h3>Pouvoir {{ index + 1 }} — {{ power.name }}</h3>
              <p>{{ power.description }}</p>
            </article>
          }
        </div>
      }
      @if (note) { <p class="codex-dialog__note">{{ note }}</p> }
    </div>
  </section>
</div>
