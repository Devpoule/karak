<header class="game-header">
  <button class="game-header__home game-header__home-button" type="button" aria-label="Accueil" title="Accueil" (click)="requestLeave()">
    <svg class="game-header__home-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M3 10.5 12 3l9 7.5" />
      <path d="M5.5 9.5V21h13V9.5M9 21v-6h6v6" />
    </svg>
    <span>Accueil</span>
  </button>

  <img
    class="game-header__logo"
    ngSrc="/assets/logo-260.png"
    width="260"
    height="146"
    alt="Karak"
    draggable="false"
  />

  <div class="game-header__actions">
    <app-settings-panel [compact]="true" />
    @if (context === 'game') {
      @if (navigationLocked) {
        <span class="game-header__link game-header__link--disabled game-header__codex-link" aria-disabled="true" aria-label="Codex" title="Découvrir l'univers du jeu">
          <svg class="game-header__codex-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5z" />
            <path d="M5 4.5v17M8 5.5h8M8 9h8M8 12.5h5" />
          </svg>
          <span>Codex</span>
        </span>
      } @else {
        <a class="game-header__link game-header__codex-link" routerLink="/codex" [queryParams]="{ from: 'game' }" aria-label="Codex" title="Découvrir l'univers du jeu">
          <svg class="game-header__codex-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5z" />
            <path d="M5 4.5v17M8 5.5h8M8 9h8M8 12.5h5" />
          </svg>
          <span>Codex</span>
        </a>
      }
    } @else {
      <a
        class="game-header__link"
        routerLink="/play"
      >
        Jouer →
      </a>
    }
  </div>

</header>

@if (showLeaveConfirmation) {
  <div class="game-header__dialog-backdrop" role="presentation" (click)="cancelLeave()">
    <section
      class="game-header__dialog"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="leave-game-title"
      aria-describedby="leave-game-message"
      (click)="$event.stopPropagation()"
    >
      <h2 id="leave-game-title">Quitter la partie ?</h2>
      <p id="leave-game-message">
        Une aventure est en cours. Si vous quittez maintenant, votre progression sera définitivement perdue.
      </p>
      <div class="game-header__dialog-actions">
        <button type="button" class="game-header__dialog-cancel" (click)="cancelLeave()">Annuler</button>
        <button type="button" class="game-header__dialog-confirm" (click)="leaveGame()" autofocus>Quitter la partie</button>
      </div>
    </section>
  </div>
}
