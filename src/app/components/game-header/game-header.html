<header class="game-header">
  <a
    class="game-header__home"
    routerLink="/"
  >
    ← Accueil
  </a>

  <img
    class="game-header__logo"
    src="/assets/logo.png"
    alt="Karak"
    draggable="false"
  />

  <div class="game-header__actions">
    @if (context === 'game') {
      <a
        class="game-header__link"
        routerLink="/rules"
      >
        Règles
      </a>

      <span class="game-header__separator">|</span>

      <div class="game-header__turn">
        Tour / actions
      </div>
    } @else {
      <a
        class="game-header__link"
        routerLink="/game"
      >
        Jouer →
      </a>
    }
  </div>
</header>
