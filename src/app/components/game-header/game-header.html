<header class="game-header">
  <button
    class="game-header__logo-link"
    type="button"
    aria-label="Retour à l'accueil"
    title="Retour à l'accueil"
    (click)="requestLeave()"
  >
    <img
      class="game-header__logo"
      ngSrc="/assets/logo-260.png"
      width="260"
      height="146"
      alt="Karak"
      draggable="false"
    />
  </button>

  <button
    #menuTrigger
    class="karak-header-action game-header__menu-trigger"
    type="button"
    aria-label="Ouvrir le menu de partie"
    title="Menu"
    aria-haspopup="true"
    [attr.aria-expanded]="isMenuOpen"
    [attr.aria-disabled]="navigationLocked"
    [disabled]="navigationLocked"
    aria-controls="game-header-menu"
    (click)="toggleMenu(menuTrigger)"
  >
    <span class="game-header__menu-icon" aria-hidden="true"><span></span><span></span><span></span></span>
    <span class="karak-header-action__label">Menu</span>
  </button>

</header>

@if (isMenuOpen) {
  <div id="game-header-menu" class="game-header__menu" role="menu" aria-label="Commandes de partie">
    <app-tutorial-panel [compact]="true" [disabled]="navigationLocked" (click)="closeMenu()" />
    <app-settings-panel [compact]="true" [disabled]="navigationLocked" (click)="closeMenu()" />
    @if (context === 'game') {
      <a class="game-header__menu-item" role="menuitem" routerLink="/codex" [queryParams]="{ from: 'game' }" (click)="closeMenu()">
        <span aria-hidden="true">▣</span><span>Encyclopédie</span>
      </a>
      @if (gameService.phase() === 'playing') {
        <app-event-history />
      }
    } @else {
      <a class="game-header__menu-item" role="menuitem" routerLink="/play" (click)="closeMenu()">Jouer →</a>
    }
  </div>
}

@if (showLeaveConfirmation) {
  <div class="game-header__dialog-backdrop" role="presentation" (click)="cancelLeave()">
    <section
      class="game-header__dialog"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="leave-game-title"
      aria-describedby="leave-game-message"
      (click)="$event.stopPropagation()"
    >
      <h2 id="leave-game-title">Quitter la partie ?</h2>
      <p id="leave-game-message">
        Une aventure est en cours. Si vous quittez maintenant, votre progression sera définitivement perdue.
      </p>
      <div class="game-header__dialog-actions">
        <button type="button" class="game-header__dialog-cancel" (click)="cancelLeave()">Annuler</button>
        <button type="button" class="game-header__dialog-confirm" (click)="leaveGame()" autofocus>Quitter la partie</button>
      </div>
    </section>
  </div>
}
