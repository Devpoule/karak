<header class="game-header">
  @if (context === 'game' && navigationLocked) {
    <span class="game-header__home game-header__home--disabled" aria-disabled="true">← Accueil</span>
  } @else {
    <a class="game-header__home" routerLink="/">← Accueil</a>
  }

  <img
    class="game-header__logo"
    src="/assets/logo.png"
    alt="Karak"
    draggable="false"
  />

  <div class="game-header__actions">
    @if (context === 'game') {
      @if (navigationLocked) {
        <span class="game-header__link game-header__link--disabled" aria-disabled="true">Codex</span>
      } @else {
        <a class="game-header__link" routerLink="/codex">Codex</a>
      }

      <span class="game-header__separator">|</span>

      <div class="game-header__turn">
        Tour / actions
      </div>
    } @else {
      <a
        class="game-header__link"
        routerLink="/play"
      >
        Jouer →
      </a>
    }
  </div>

</header>
