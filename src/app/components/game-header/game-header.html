<header class="game-header">
  <button class="game-header__home game-header__home-button" type="button" (click)="requestLeave()">
    ← Accueil
  </button>

  <img
    class="game-header__logo"
    src="/assets/logo.png"
    alt="Karak"
    draggable="false"
  />

  <div class="game-header__actions">
    @if (context === 'game') {
      @if (navigationLocked) {
        <span class="game-header__link game-header__link--disabled" aria-disabled="true">Codex</span>
      } @else {
        <a class="game-header__link" routerLink="/codex" [queryParams]="{ from: 'game' }">Codex</a>
      }

      <span class="game-header__separator">|</span>

      <div class="game-header__turn">
        <span class="game-header__turn-label game-header__turn-label--full">Tour / actions</span>
        <span class="game-header__turn-label game-header__turn-label--compact">Tour</span>
      </div>
    } @else {
      <a
        class="game-header__link"
        routerLink="/play"
      >
        Jouer →
      </a>
    }
  </div>

</header>

@if (showLeaveConfirmation) {
  <div class="game-header__dialog-backdrop" role="presentation" (click)="cancelLeave()">
    <section
      class="game-header__dialog"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="leave-game-title"
      aria-describedby="leave-game-message"
      (click)="$event.stopPropagation()"
    >
      <h2 id="leave-game-title">Quitter la partie ?</h2>
      <p id="leave-game-message">
        Une aventure est en cours. Si vous quittez maintenant, votre progression sera définitivement perdue.
      </p>
      <div class="game-header__dialog-actions">
        <button type="button" class="game-header__dialog-cancel" (click)="cancelLeave()">Annuler</button>
        <button type="button" class="game-header__dialog-confirm" (click)="leaveGame()" autofocus>Quitter la partie</button>
      </div>
    </section>
  </div>
}
