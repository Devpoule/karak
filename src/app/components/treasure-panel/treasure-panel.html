<section class="treasure-panel" aria-label="Trésors collectés" data-toast-anchor="treasure" [attr.data-player-index]="playerIndex">
  <img class="treasure-panel__board" src="/assets/board/hero-points-panel.png" alt="" draggable="false" />
  <div class="treasure-panel__content">
    <div class="treasure-panel__treasures">
      @if (groups.length) {
        <div class="treasure-panel__groups">
          @for (group of groups; track group.type) {
            <div class="treasure-panel__group">
              <img
                [src]="group.image"
                [alt]="group.count | quantity: group.singularLabel : group.pluralLabel"
                draggable="false"
              />
              <span class="treasure-panel__count" aria-label="Nombre">×{{ group.count }}</span>
            <span class="treasure-panel__label">{{ group.count | quantity: group.singularLabel : group.pluralLabel }}</span>
            </div>
          }
        </div>
      } @else {
        <span class="treasure-panel__empty">Aucun trésor</span>
      }
    </div>

    <strong class="treasure-panel__points">{{ points | quantity: 'PT' : 'PTS' }}</strong>
  </div>
</section>
