<div class="player-hud">

  <!-- =====================================================
       FICHE GAUCHE — J1
       ===================================================== -->

  @if (playerOne; as player) {
    <aside
      class="player-hud__side player-hud__side--left"
      [class.player-hud__side--open]="leftPanelOpen"
      [class.player-hud__side--active]="isActivePlayer(0)"
      [attr.aria-hidden]="!leftPanelOpen"
    >
      <app-player-sidebar
        side="left"
        [player]="player"
        [showPlayer]="true"
        [showInventory]="true"
        [showMessage]="true"
      />
    </aside>
  }


  <!-- =====================================================
       FICHE DROITE — J2 À J5
       ===================================================== -->

  @if (players.length > 1) {
    <aside
      class="player-hud__side player-hud__side--right"
      [class.player-hud__side--open]="rightPanelOpen"
      [class.player-hud__side--active]="
        isActivePlayer(rightPlayerIndex)
      "
      [attr.aria-hidden]="!rightPanelOpen"
    >
      @if (rightPlayer; as player) {
        <app-player-sidebar
          side="right"
          [player]="player"
          [showPlayer]="true"
          [showInventory]="true"
          [showMessage]="true"
        />
      }
    </aside>
  }


  <!-- =====================================================
       COMMANDES DU TOUR
       =====================================================

       Chaque joueur est représenté par une seule languette
       en pierre.

       Le chevron indique l'état de sa fiche :
       ▲ fiche fermée
       ▼ fiche ouverte

       La couleur du joueur reste présente sous la forme
       d'un liseré discret.
       ===================================================== -->

  <div class="player-hud__turn-controls">

    <!-- J1 -->

    @if (playerOne) {
      <button
        class="player-hud__player-control"
        type="button"
        [class.player-hud__player-control--open]="
          isPlayerPanelOpen(0)
        "
        [class.player-hud__player-control--active]="
          isActivePlayer(0)
        "
        [style.--player-color]="getPlayerColor(0)"
        [attr.aria-label]="
          leftPanelOpen
            ? 'Fermer la fiche du joueur 1'
            : 'Afficher la fiche du joueur 1'
        "
        [attr.aria-pressed]="leftPanelOpen"
        (click)="togglePlayerOne()"
      >
        <span
          class="player-hud__player-chevron"
          aria-hidden="true"
        >
          {{ leftPanelOpen ? '▼' : '▲' }}
        </span>

        <span class="player-hud__player-label">
          J1
        </span>
      </button>
    }


    <!-- MOUVEMENTS -->

    <div class="player-hud__movements">
      <app-movement-counter />
    </div>


    <!-- J2 À J5 -->

    <div class="player-hud__opponents">
      @for (
        player of players.slice(1);
        track $index;
        let playerIndex = $index
      ) {
        <button
          class="player-hud__player-control"
          type="button"
          [class.player-hud__player-control--open]="
            isPlayerPanelOpen(playerIndex + 1)
          "
          [class.player-hud__player-control--active]="
            isActivePlayer(playerIndex + 1)
          "
          [style.--player-color]="
            getPlayerColor(playerIndex + 1)
          "
          [attr.aria-label]="
            isPlayerPanelOpen(playerIndex + 1)
              ? 'Fermer la fiche du joueur ' + (playerIndex + 2)
              : 'Afficher la fiche du joueur ' + (playerIndex + 2)
          "
          [attr.aria-pressed]="
            isPlayerPanelOpen(playerIndex + 1)
          "
          (click)="toggleRightPlayer(playerIndex + 1)"
        >
          <span
            class="player-hud__player-chevron"
            aria-hidden="true"
          >
            {{
              isPlayerPanelOpen(playerIndex + 1)
                ? '▼'
                : '▲'
            }}
          </span>

          <span class="player-hud__player-label">
            J{{ playerIndex + 2 }}
          </span>
        </button>
      }
    </div>

  </div>

</div>
