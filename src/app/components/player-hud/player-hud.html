<div class="player-hud">

  <!-- =====================================================
       PANNEAU GAUCHE — JOUEURS HUMAINS
       =====================================================

       Tous les joueurs humains utilisent le panneau gauche.

       Lorsqu'un autre joueur humain est sélectionné alors
       qu'une fiche est déjà ouverte :

       1. la fiche actuelle se replie ;
       2. son animation se termine ;
       3. le contenu est remplacé ;
       4. la nouvelle fiche se déplie.

       Le panneau reste monté dans le DOM pendant toute
       l'animation afin de garantir un repli naturel.
       ===================================================== -->

  @if (leftPlayer; as player) {
    <aside
      class="player-hud__side player-hud__side--left"
      [class.player-hud__side--open]="leftPanelOpen"
      [class.player-hud__side--active]="
        isActivePlayer(leftPlayerIndex)
      "
      [attr.aria-hidden]="!leftPanelOpen"
      (transitionend)="onLeftPanelTransitionEnd($event)"
    >
      <app-player-sidebar
        side="left"
        [player]="player"
        [playerColor]="getPlayerColor(leftPlayerIndex)"
        [showPlayer]="true"
        [showInventory]="true"
        [showMessage]="true"
      />
    </aside>
  }


  <!-- =====================================================
       PANNEAU DROIT — JOUEURS IA
       =====================================================

       Tous les joueurs contrôlés par l'IA utilisent le
       panneau droit.

       Le fonctionnement est symétrique à celui du panneau
       gauche :

       1. l'ancienne fiche se replie ;
       2. son animation se termine ;
       3. le contenu est remplacé ;
       4. la nouvelle fiche se déplie.
       ===================================================== -->

  @if (rightPlayer; as player) {
    <aside
      class="player-hud__side player-hud__side--right"
      [class.player-hud__side--open]="rightPanelOpen"
      [class.player-hud__side--active]="
        isActivePlayer(rightPlayerIndex)
      "
      [attr.aria-hidden]="!rightPanelOpen"
      (transitionend)="onRightPanelTransitionEnd($event)"
    >
      <app-player-sidebar
        side="right"
        [player]="player"
        [playerColor]="getPlayerColor(rightPlayerIndex)"
        [showPlayer]="true"
        [showInventory]="true"
        [showMessage]="true"
      />
    </aside>
  }


  <!-- =====================================================
       COMMANDES DU TOUR
       =====================================================

       Organisation :

       HUMAINS | MOUVEMENTS | IA

       Les joueurs humains sont toujours placés à gauche
       du compteur de mouvements.

       Les joueurs contrôlés par l'IA sont toujours placés
       à droite.

       Leur numéro J1...J5 reste leur identité réelle dans
       la partie et n'est jamais recalculé selon leur position.

       Exemple :

       J1 humain
       J2 IA
       J3 humain
       J4 IA

       devient visuellement :

       J1 J3 | MOUVEMENTS | J2 J4
       ===================================================== -->

  <div class="player-hud__turn-controls">


    <!-- ===================================================
         JOUEURS HUMAINS
         =================================================== -->

    <div
      class="
        player-hud__players
        player-hud__players--human
      "
    >
      @for (
        entry of humanPlayers;
        track entry.index
      ) {
        <button
          class="player-hud__player-control"
          type="button"

          [class.player-hud__player-control--open]="
            isPlayerPanelOpen(entry.index)
          "

          [class.player-hud__player-control--active]="
            isActivePlayer(entry.index)
          "

          [style.--player-color]="
            getPlayerColor(entry.index)
          "

          [attr.aria-label]="
            isPlayerPanelOpen(entry.index)
              ? 'Fermer la fiche du joueur ' + (entry.index + 1)
              : 'Afficher la fiche du joueur ' + (entry.index + 1)
          "

          [attr.aria-pressed]="
            isPlayerPanelOpen(entry.index)
          "

          (click)="togglePlayerPanel(entry.index)"
        >

          <!--
            Le chevron indique uniquement l'état de la fiche.

            ▲ = fiche repliée
            ▼ = fiche dépliée
          -->
          <span
            class="player-hud__player-chevron"
            aria-hidden="true"
          >
            {{
              isPlayerPanelOpen(entry.index)
                ? '▼'
                : '▲'
            }}
          </span>


          <!--
            Numéro réel du joueur.

            L'index est conservé même lorsque l'ordre visuel
            sépare les humains des IA.
          -->
          <span class="player-hud__player-label">
            J{{ entry.index + 1 }}
          </span>

        </button>
      }
    </div>


    <!-- ===================================================
         COMPTEUR DE MOUVEMENTS
         =================================================== -->

    <div class="player-hud__movements">
      <app-movement-counter />
    </div>


    <!-- ===================================================
         JOUEURS IA
         =================================================== -->

    <div
      class="
        player-hud__players
        player-hud__players--ai
      "
    >
      @for (
        entry of aiPlayers;
        track entry.index
      ) {
        <button
          class="player-hud__player-control"
          type="button"

          [class.player-hud__player-control--open]="
            isPlayerPanelOpen(entry.index)
          "

          [class.player-hud__player-control--active]="
            isActivePlayer(entry.index)
          "

          [style.--player-color]="
            getPlayerColor(entry.index)
          "

          [attr.aria-label]="
            isPlayerPanelOpen(entry.index)
              ? 'Fermer la fiche du joueur ' + (entry.index + 1)
              : 'Afficher la fiche du joueur ' + (entry.index + 1)
          "

          [attr.aria-pressed]="
            isPlayerPanelOpen(entry.index)
          "

          (click)="togglePlayerPanel(entry.index)"
        >

          <!--
            Même comportement que pour les humains.

            Le côté d'ouverture de la fiche est déterminé
            par le contrôleur du joueur dans PlayerHud.
          -->
          <span
            class="player-hud__player-chevron"
            aria-hidden="true"
          >
            {{
              isPlayerPanelOpen(entry.index)
                ? '▼'
                : '▲'
            }}
          </span>


          <span class="player-hud__player-label">
            J{{ entry.index + 1 }}
          </span>

        </button>
      }
    </div>

  </div>

</div>
