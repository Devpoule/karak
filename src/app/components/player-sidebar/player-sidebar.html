<aside class="player-sidebar">

  <!-- =====================================================
       JOUEUR
       Points de vie + héros
       ===================================================== -->

  @if (showPlayer) {
    <app-life-panel [player]="player" />
    <app-hero-panel [player]="player" />
  }


  <!-- =====================================================
       INVENTAIRE
       ===================================================== -->

  @if (showInventory) {
    <app-inventory-panel [player]="player" />
  }


  <!-- =====================================================
       MESSAGES DU JOUEUR
       ===================================================== -->

  @if (showMessage) {
    <app-message-panel />
  }

</aside>
