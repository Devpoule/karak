<aside class="player-sidebar" [class.player-sidebar--left]="side === 'left'" [class.player-sidebar--right]="side === 'right'" [class.player-sidebar--active]="isActive">
  <span class="player-sidebar__frame" aria-hidden="true"></span>
  <section class="player-sidebar__movement-panel" aria-label="Points de mouvement du joueur">
    <img
      class="player-sidebar__movement-panel-image"
      src="/assets/board/hero-movement-counter-panel.png"
      alt=""
      draggable="false"
    />
    <div class="player-sidebar__movement-counter">
      <app-movement-counter [compact]="true" [active]="isActive" />
    </div>
  </section>

  <!-- =====================================================
       JOUEUR
       Points de vie + héros
       ===================================================== -->

  @if (heroDefinition; as hero) {
    <div class="player-sidebar__name-row">
      <section class="player-sidebar__name-panel" aria-label="Héros sélectionné">
        <img src="/assets/board/hero-name-panel.png" alt="" draggable="false" />
        <h2>{{ hero.name }}</h2>
        @if (playerIndex !== null) {
        <button
          type="button"
          class="player-sidebar__player-tab"
          [class.player-sidebar__player-tab--active]="isActive"
          [attr.aria-label]="'Masquer la fiche du joueur ' + (playerIndex + 1)"
          (click)="handlePlayerTabClick()"
        >
          <span class="player-sidebar__player-chevron" aria-hidden="true">▼</span>
          <span class="player-sidebar__player-label">J{{ playerIndex + 1 }}</span>
        </button>
        }

      </section>
    </div>
  }

  @if (showPlayer) {
    <app-hero-panel [player]="player" [playerIndex]="playerIndex" [side]="side" [isActive]="isActive" (portraitClicked)="toggleBiography()" (curseClicked)="openCurseDialog()" />
    <app-life-panel [player]="player" [playerIndex]="playerIndex" />
  }


  <!-- =====================================================
       INVENTAIRE
       ===================================================== -->

  @if (showInventory) {
    <app-inventory-panel
      [player]="player"
      [playerIndex]="playerIndex"
    />

    <app-treasure-panel
      [player]="player"
      [playerIndex]="playerIndex"
    />

    @if (heroDefinition; as hero) {
      <section class="player-sidebar__technical" aria-label="Informations du héros" data-toast-anchor="power" [attr.data-player-index]="playerIndex">
        <img src="/assets/board/hero-powers-panel.png" alt="" draggable="false" />
        <div class="player-sidebar__technical-content">
          <div class="player-sidebar__powers" role="group" aria-label="Pouvoirs du héros">
            @for (power of hero.powers; track power.id; let index = $index) {
              <button
                type="button"
                class="player-sidebar__power-badge"
                [class.player-sidebar__power-badge--selected]="selectedPowerId === power.id"
                [class.player-sidebar__power-badge--disabled]="player?.isCursed"
                [attr.aria-pressed]="selectedPowerId === power.id"
                [attr.aria-disabled]="interactionLocked ? 'true' : null"
                [attr.aria-label]="'Consulter pouvoir ' + (index + 1) + ' : ' + power.name + (player?.isCursed ? ' — pouvoir indisponible' : '')"
                [attr.title]="power.name"
                [attr.data-tooltip]="player?.isCursed ? 'Pouvoir indisponible en jeu ; cliquer pour consulter sa description' : power.name + ' — ' + power.description"
                (click)="togglePower(power.id, $event)"
              >
                <img [src]="powerImage(index)" alt="" draggable="false" />
                <span class="sr-only">Pouvoir {{ index + 1 }} : {{ power.name }}</span>
              </button>
            }
          </div>
        </div>
      </section>

      @if (biographyOpen) {
        <app-codex-dialog
          [title]="hero.name"
          [subtitle]="hero.nickname"
          [icon]="hero.characterTransparent"
          [iconAlt]="hero.name"
          [body]="hero.description"
          [placement]="side"
          (closed)="closeDetails()"
        />
      }

      @if (curseDialogOpen && player?.isCursed) {
        <app-codex-dialog
          title="Malédiction"
          [subtitle]="hero.name"
          [icon]="'/assets/tokens/curse.png'"
          iconAlt="Médaillon de malédiction"
          [body]="hero.name + ' est sous l’emprise d’une malédiction.'"
          [powers]="hero.powers"
          note="Ses pouvoirs spéciaux sont inutilisables tant que la malédiction n’est pas levée."
          [placement]="side"
          (closed)="closeDetails()"
        />
      }

    }
  }


  <!-- =====================================================
       MESSAGES DU JOUEUR
       =====================================================

       La couleur du joueur est transmise au panneau afin
       d'apporter un rappel visuel discret de son identité.

       Cette couleur n'a aucune incidence sur le gameplay.
       ===================================================== -->

</aside>
