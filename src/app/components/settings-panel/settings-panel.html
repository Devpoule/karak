<div class="settings-panel" [class.settings-panel--compact]="compact">
  <button
    type="button"
    class="settings-panel__trigger"
    [class.settings-panel__trigger--compact]="compact"
    aria-label="Paramètres"
    aria-haspopup="dialog"
    [attr.aria-expanded]="isOpen"
    (click)="open()"
  >
    <svg class="settings-panel__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" />
      <path d="m19.4 15 .1.1a1.8 1.8 0 1 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3.1 1.3v.2a1.8 1.8 0 1 1-3.6 0v-.2a1.8 1.8 0 0 0-3.1-1.3l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1A1.8 1.8 0 0 0 4.3 12a1.8 1.8 0 0 0-1.3-3.1h-.2a1.8 1.8 0 1 1 0-3.6H3a1.8 1.8 0 0 0 1.3-3.1l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1A1.8 1.8 0 0 0 9.9 1.3v-.2a1.8 1.8 0 1 1 3.6 0v.2a1.8 1.8 0 0 0 3.1 1.3l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1A1.8 1.8 0 0 0 19.7 8h.2a1.8 1.8 0 1 1 0 3.6h-.2a1.8 1.8 0 0 0-.3 3.4Z" />
    </svg>
    <span class="settings-panel__label">Paramètres</span>
  </button>

  @if (isOpen) {
    <div class="settings-panel__backdrop" role="presentation" (click)="close()">
      <section
        #dialogElement
        class="settings-panel__dialog"
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        aria-labelledby="settings-panel-title"
        (click)="$event.stopPropagation()"
      >
        <header class="settings-panel__header">
          <div>
            <p class="settings-panel__eyebrow">Confort de jeu</p>
            <h2 id="settings-panel-title">Paramètres</h2>
          </div>
          <button type="button" class="settings-panel__close" aria-label="Fermer les paramètres" (click)="close()">×</button>
        </header>

        <div class="settings-panel__body">
          <fieldset>
            <legend>Animations</legend>
            <p class="settings-panel__hint">Adaptez les mouvements et transitions à votre confort.</p>
            <label>
              <input
                type="radio"
                name="settings-motion"
                value="system"
                [checked]="settings.motionPreference() === 'system'"
                (change)="setMotionPreference('system')"
              />
              <span>Selon le système</span>
            </label>
            <label>
              <input
                type="radio"
                name="settings-motion"
                value="reduced"
                [checked]="settings.motionPreference() === 'reduced'"
                (change)="setMotionPreference('reduced')"
              />
              <span>Animations réduites</span>
            </label>
          </fieldset>

          <fieldset>
            <legend>Taille du texte</legend>
            <p class="settings-panel__hint">Agrandissez les textes de l'interface sans modifier les règles.</p>
            <label>
              <input
                type="radio"
                name="settings-text-scale"
                value="standard"
                [checked]="settings.textScale() === 'standard'"
                (change)="setTextScale('standard')"
              />
              <span>Standard</span>
            </label>
            <label>
              <input
                type="radio"
                name="settings-text-scale"
                value="large"
                [checked]="settings.textScale() === 'large'"
                (change)="setTextScale('large')"
              />
              <span>Grande</span>
            </label>
          </fieldset>
        </div>

        <footer class="settings-panel__actions">
          <button type="button" class="settings-panel__reset" (click)="reset()">Réinitialiser</button>
          <button type="button" class="settings-panel__confirm" (click)="close()">Fermer</button>
        </footer>
      </section>
    </div>
  }
</div>
