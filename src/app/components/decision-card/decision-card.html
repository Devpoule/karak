<article class="decision-card" [class.decision-card--compact]="compact" [class.decision-card--embedded]="embedded" role="dialog" aria-modal="true" aria-labelledby="decision-card-title" tabindex="-1">
  <div class="decision-card__aura" aria-hidden="true"></div>
  @if (image) {
    <img class="decision-card__image" [src]="image" [alt]="imageAlt" draggable="false" />
  }
  <div class="decision-card__content">
    <span class="decision-card__eyebrow">{{ eyebrow }}</span>
    <h2 id="decision-card-title">{{ title }}</h2>
    <p>{{ description }}</p>
    <div class="decision-card__actions">
      @for (action of actions; track action.label; let index = $index) {
        <button
          type="button"
          [class.decision-card__primary]="action.kind === 'primary'"
          [disabled]="action.disabled ?? false"
          [attr.aria-label]="action.label"
          [title]="action.label"
          (click)="selectAction(index)"
        >@if (embedded) { <span aria-hidden="true">{{ index === 0 ? '✓' : '×' }}</span> } @else { {{ action.label }} }</button>
      }
    </div>
  </div>
</article>
