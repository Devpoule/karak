<section
  class="life-panel"
  [class.life-panel--damage]="feedback === 'damage'"
  [class.life-panel--heal]="feedback === 'heal'"
  [attr.aria-label]="'Points de vie : ' + lives + ' sur 5'"
>
  <img
    class="life-panel__board"
    src="/assets/board/life-panel.png"
    alt=""
    draggable="false"
  />

  <div class="life-panel__slots" aria-hidden="true">
    @for (slot of lifeSlots; track slot.index) {
      <img
        class="life-panel__point"
        [class.life-panel__point--changed]="isChangedSlot(slot.index)"
        [src]="slot.active ? '/assets/tokens/life-point.png' : '/assets/tokens/dead-point.png'"
        alt=""
        draggable="false"
      />
    }
  </div>

  <span
    class="life-panel__impulse"
    aria-hidden="true"
  ></span>

  @if (feedback === 'heal') {
    <span class="life-panel__heal-label" aria-hidden="true">+1 PV</span>
  }
</section>
