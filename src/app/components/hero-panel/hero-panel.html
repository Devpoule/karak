<section
  class="hero-panel"
  [class.hero-panel--unconscious]="isUnconscious"
  [attr.aria-label]="isUnconscious ? 'Héros inconscient : récupération obligatoire' : null"
>
  <!--
    Support visuel du héros.

    hero-panel.png constitue le cadre de pierre.

    L'illustration du personnage est superposée
    sans modifier les dimensions du panneau.
  -->
  <img
    class="hero-panel__board"
    src="/assets/board/hero-panel.png"
    alt=""
    draggable="false"
  />

  @if (heroDefinition; as hero) {
    <div
      class="hero-panel__hero"
      [attr.aria-label]="hero.name"
    >
      <img
        class="hero-panel__card"
        [src]="hero.characterStats"
        [alt]="hero.name"
        draggable="false"
      />
      @if (isCursed) {
        <img
          class="hero-panel__curse"
          [src]="curseImagePath"
          alt="Héros maudit : pouvoirs spéciaux désactivés"
          draggable="false"
        />
      }
    </div>
    <details class="hero-panel__details">
      <summary>{{ hero.name }}</summary>
      <div class="hero-panel__powers">
        <p class="hero-panel__description">{{ hero.description }}</p>
        @for (power of hero.powers; track power.id) {
          <article>
            <h3>Pouvoir {{ $index + 1 }} — {{ power.name }}</h3>
            <p>{{ power.description }}</p>
          </article>
        }
      </div>
    </details>
  }
</section>
