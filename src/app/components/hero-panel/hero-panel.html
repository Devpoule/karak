<section class="hero-panel">
  <img
    class="hero-panel__board"
    src="/assets/board/board_02.jpg"
    alt=""
    draggable="false"
  />

  @if (heroDefinition; as hero) {
    <div class="hero-panel__hero">
      <img
        class="hero-panel__card"
        [src]="hero.card"
        [alt]="hero.name"
        draggable="false"
      />

      <strong class="hero-panel__name">
        {{ hero.name }}
      </strong>
    </div>
  }
</section>
