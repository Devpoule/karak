<section
  class="hero-panel"
  data-toast-anchor="curse"
  [attr.data-player-index]="playerIndex"
  [class.hero-panel--left]="side === 'left'"
  [class.hero-panel--right]="side === 'right'"
  [class.hero-panel--unconscious]="isUnconscious"
  [class.hero-panel--healing-target]="isHealingPortalTarget"
  [class.hero-panel--active]="isActive"
  [class.hero-panel--curse-applying]="curseAnimation() === 'hero-panel__curse--appearing'"
  [style.--hero-color]="heroColor"
  [attr.aria-label]="isUnconscious ? 'Héros inconscient : récupération obligatoire' : null"
>
  <!--
    Support visuel du héros.

    hero-portrait-panel.png constitue le cadre de pierre.

    L'illustration du personnage est superposée
    sans modifier les dimensions du panneau.
  -->
  <img
    class="hero-panel__board"
    src="/assets/board/hero-portrait-panel.png"
    alt=""
    draggable="false"
  />

  @if (heroDefinition; as hero) {
    <div
      class="hero-panel__hero"
      [class.hero-panel__hero--deciding]="powerDecision !== null"
    >
      <div
        class="hero-panel__card-stage"
        [class.hero-panel__card-stage--flipped]="substitutionFlipped() || powerDecision !== null"
      >
        <div class="hero-panel__card-face hero-panel__card-face--front" [attr.aria-hidden]="substitutionFlipped() || powerDecision ? 'true' : null">
          <button
            class="hero-panel__portrait-button"
            type="button"
            [disabled]="substitutionFlipped() || powerDecision !== null"
            [attr.tabindex]="substitutionFlipped() || powerDecision ? -1 : null"
            [attr.aria-label]="gameService.healingPortalSelection() ? 'Sélectionner ' + hero.name + ' comme cible du portail' : 'Afficher les informations de ' + hero.name"
            (click)="openBiography()"
          >
            <img class="hero-panel__card" [src]="hero.characterStats" [alt]="hero.name" draggable="false" />
          </button>
        </div>
        <div
          class="hero-panel__card-face hero-panel__card-face--back"
          [attr.aria-hidden]="substitutionFlipped() || powerDecision ? null : 'true'"
          aria-live="polite"
        >
          @if (powerDecision; as decision) {
            <app-hero-power-card
              class="hero-panel__power-card"
              [inventory]="true"
              [mode]="decision.mode"
              [hero]="hero"
              [power]="decision.power"
              [message]="decision.message"
              [choices]="decision.choices"
              [choiceCancelable]="decision.cancelable"
              [activateLabel]="decision.activateLabel"
              [declineLabel]="decision.declineLabel"
              (activated)="chooseSneak('sneak')"
              (declined)="chooseSneak('combat')"
              (choiceSelected)="choosePowerOption($event)"
              (choiceCancelled)="cancelPowerChoice()"
            />
          } @else if (substitutionPower; as power) {
            <app-hero-power-card
              class="hero-panel__power-card"
              mode="announcement"
              [hero]="hero"
              [power]="power"
              [message]="substitutionMessage"
            />
          }
        </div>
      </div>
    </div>
      <!--
        isCursed lit curseRevision et maintient le lien réactif avec
        l'état métier. curseVisible reste vrai pendant la dissipation,
        afin que l'animation de disparition puisse aller à son terme.
      -->
      @if (isCursed || curseVisible()) {
        <button
          class="hero-panel__curse"
          [class.hero-panel__curse--appearing]="curseAnimation() === 'hero-panel__curse--appearing'"
          [class.hero-panel__curse--disappearing]="curseAnimation() === 'hero-panel__curse--disappearing'"
          type="button"
          aria-label="Afficher les informations de la malédiction"
          (click)="curseClicked.emit()"
        >
          <img [src]="curseImagePath" alt="Héros maudit : pouvoirs spéciaux désactivés" draggable="false" />
        </button>
      }
  }
</section>
