<section
  class="movement-counter"
  [class.movement-counter--compact]="compact"
  [attr.aria-label]="movementPoints.length | quantity: 'point disponible' : 'points disponibles'"
>
  <span class="movement-counter__label">
    Mouvements
  </span>

  <div
    class="movement-counter__points"
    aria-hidden="true"
  >
    @for (pointIndex of pointIndexes; track pointIndex) {
      <span
        class="movement-counter__point"
        [class.movement-counter__point--consumed]="isPointConsumed(pointIndex)"
        [class.movement-counter__point--consuming]="isPointAnimating(pointIndex)"
        [class.movement-counter__point--resetting]="isPointResetting()"
      >
        <span class="movement-counter__point-core">●</span>
        <span class="movement-counter__fragments" aria-hidden="true">
          @for (fragmentIndex of fragmentIndexes; track fragmentIndex) {
            <span class="movement-counter__fragment" [class]="'movement-counter__fragment--' + fragmentIndex"></span>
          }
        </span>
      </span>
    }
  </div>
</section>
