<section
  class="movement-counter"
  [attr.aria-label]="movementPoints.length | quantity: 'mouvement disponible' : 'mouvements disponibles'"
>
  <span class="movement-counter__label">
    Mouvements
  </span>

  <div
    class="movement-counter__points"
    aria-hidden="true"
  >
    @for (point of movementPoints; track $index) {
      <span class="movement-counter__point">●</span>
    }
  </div>
</section>
